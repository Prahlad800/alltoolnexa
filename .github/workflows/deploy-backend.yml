name: AllToolNexa Flask Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alltoolnexa-backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test backend and deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt requests
      - name: Backend tests
        working-directory: backend
        env:
          AUTH_MODE: database
          DATABASE_URL: ""
        run: python -m unittest discover -s tests -v
      - name: Deployment tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  deploy:
    name: Deploy Flask to PythonAnywhere
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deployment dependencies
        run: python -m pip install requests python-dotenv 'psycopg[binary]>=3.2.3,<4' 'SQLAlchemy>=2.0.36,<2.1'
      - name: Upload backend, reload and verify database
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_USERNAME: prahlad800
          PA_DOMAIN: prahlad800.pythonanywhere.com
        run: python .github/scripts/deploy_backend.py
