# Replace tools.example.com and certificate paths with your real deployment.
# Run Next.js on 127.0.0.1:3000 behind this proxy.
server {
    listen 80;
    server_name tools.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tools.example.com;
    ssl_certificate /etc/letsencrypt/live/tools.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
